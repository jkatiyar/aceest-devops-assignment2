apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-app
      version: v2
  template:
    metadata:
      labels:
        app: aceest-app
        version: v2
    spec:
      containers:
      - name: aceest-app
        image: jkatiyar007/aceest-app:v2
        ports:
        - containerPort: 5000