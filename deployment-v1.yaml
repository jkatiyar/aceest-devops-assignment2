apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-app
      version: v1
  template:
    metadata:
      labels:
        app: aceest-app
        version: v1
    spec:
      containers:
      - name: aceest-app
        image: jkatiyar007/aceest-app:v1
        ports:
        - containerPort: 5000